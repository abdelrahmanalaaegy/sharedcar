<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareRide - نشر رحلة</title>
    <!-- Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- خط Tajawal من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .form-input { 
            width: 100%; padding: 1rem; background-color: #f1f5f9; 
            border-radius: 1rem; border: none; outline: none; transition: 0.3s;
        }
        .form-input:focus { ring: 2px; ring-color: #00a884; background-color: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .btn-primary { 
            background-color: #00a884; color: white; width: 100%; padding: 1.25rem; 
            border-radius: 1rem; font-weight: bold; font-size: 1.1rem; transition: 0.2s;
        }
        .btn-primary:active { transform: scale(0.98); }
    </style>
</head>
<body class="pb-10">

    <div class="max-w-md mx-auto p-4">
        <!-- Header -->
        <header class="text-center my-8">
            <h1 class="text-3xl font-extrabold text-[#00a884]">ShareRide 🚗</h1>
            <p class="text-gray-500 mt-2">نظم رحلتك بلمسة واحدة</p>
        </header>

        <!-- Form Card -->
        <div class="bg-white p-6 rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-slate-100">
            <form id="tripForm" class="space-y-5">
                
                <!-- نقطة الانطلاق -->
                <div>
                    <label class="block mb-2 text-sm font-bold text-slate-700">📍 من (نقطة الانطلاق)</label>
                    <select id="origin" required class="form-input text-slate-600">
                        <option value="">اختر المكان...</option>
                        <option>أكتوبر</option><option>الشيخ زايد</option><option>حدائق أكتوبر</option><option>حدائق الأهرام</option><option>الهرم</option><option>فيصل</option><option>المعادي</option><option>حلوان</option><option>المهندسين</option><option>وسط البلد ومحيطها</option><option>شبرا مصر</option><option>شبرا الخيمة</option><option>المرج</option><option>المرج الجديدة</option><option>عين شمس</option><option>الهايكستب</option><option>جسر السويس</option><option>مصر الجديدة</option><option>التجمع الأول</option><option>التجمع الثالث</option><option>التجمع الخامس</option><option>كايرو فيستيفال</option><option>أكاديمية الشرطة</option><option>الجامعة الأمريكية</option><option>الشروق</option><option>العاصمة الإدارية</option>
                    </select>
                </div>

                <!-- نقطة الوصول -->
                <div>
                    <label class="block mb-2 text-sm font-bold text-slate-700">🎯 إلى (نقطة الوصول)</label>
                    <select id="destination" required class="form-input text-slate-600">
                        <option value="">اختر المكان...</option>
                        <option>أكتوبر</option><option>الشيخ زايد</option><option>حدائق أكتوبر</option><option>حدائق الأهرام</option><option>الهرم</option><option>فيصل</option><option>المعادي</option><option>حلوان</option><option>المهندسين</option><option>وسط البلد ومحيطها</option><option>شبرا مصر</option><option>شبرا الخيمة</option><option>المرج</option><option>المرج الجديدة</option><option>عين شمس</option><option>الهايكستب</option><option>جسر السويس</option><option>مصر الجديدة</option><option>التجمع الأول</option><option>التجمع الثالث</option><option>التجمع الخامس</option><option>كايرو فيستيفال</option><option>أكاديمية الشرطة</option><option>الجامعة الأمريكية</option><option>الشروق</option><option>العاصمة الإدارية</option>
                    </select>
                </div>

                <!-- نوع الرحلة -->
                <div class="flex gap-6 p-2 justify-center">
                    <label class="flex items-center gap-2 font-bold text-slate-600">
                        <input type="radio" name="trip_type" value="one_way" checked onchange="toggleReturnTime(false)" class="w-5 h-5 accent-[#00a884]"> ذهاب فقط
                    </label>
                    <label class="flex items-center gap-2 font-bold text-slate-600">
                        <input type="radio" name="trip_type" value="round_trip" onchange="toggleReturnTime(true)" class="w-5 h-5 accent-[#00a884]"> ذهاب وعودة
                    </label>
                </div>

                <!-- الأوقات -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-2 text-sm font-bold text-slate-700">🕒 وقت الانطلاق</label>
                        <input type="time" id="departure_time" required class="form-input">
                    </div>
                    <div id="returnTimeContainer" class="hidden">
                        <label class="block mb-2 text-sm font-bold text-slate-700">🕒 وقت العودة</label>
                        <input type="time" id="return_time" class="form-input">
                    </div>
                </div>

                <!-- واتساب -->
                <div>
                    <label class="block mb-2 text-sm font-bold text-slate-700">💬 رقم واتساب</label>
                    <input type="tel" id="whatsapp" required placeholder="01xxxxxxxxx" pattern="^01[0-2,5]\d{8}$" title="يرجى إدخال رقم مصري صحيح" class="form-input">
                </div>

                <!-- السعر والمقاعد -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-2 text-sm font-bold text-slate-700">💺 المقاعد</label>
                        <select id="seats" class="form-input">
                            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-bold text-slate-700">💰 السعر (للفرد)</label>
                        <input type="number" id="price" placeholder="ج.م" class="form-input">
                    </div>
                </div>

                <!-- الملاحظات -->
                <div>
                    <label class="block mb-2 text-sm font-bold text-slate-700">📝 ملاحظات إضافية</label>
                    <textarea id="notes" maxlength="300" placeholder="مثال: التكييف شغال، ممنوع التدخين.." class="form-input h-24 resize-none"></textarea>
                </div>

                <!-- زر النشر -->
                <button type="submit" id="submitBtn" class="btn-primary shadow-lg shadow-green-200">
                    نشر الرحلة الآن
                </button>
            </form>
        </div>
    </div>

    <script>
        // بيانات الربط الخاصة بك
        const SB_URL = "https://owzaevvsvwufozynzvin.supabase.co"; 
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93emFldnZzdnd1Zm96eW56dmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MDQ4NTgsImV4cCI6MjEwMTA4MDg1OH0.LRd_ekWBrk_BWDPv1PSmpSD9RygerdeeUCHUOQlwukQ";
        
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        // تبديل ظهور وقت العودة
        function toggleReturnTime(show) {
            const container = document.getElementById('returnTimeContainer');
            container.classList.toggle('hidden', !show);
            document.getElementById('return_time').required = show;
        }

        // تحويل الوقت لـ 12 ساعة للعرض
        function formatTime12(time) {
            if(!time) return "";
            const [h, m] = time.split(':');
            const hh = parseInt(h);
            const suffix = hh >= 12 ? 'مساءً' : 'صباحاً';
            const h12 = hh % 12 || 12;
            return `${h12}:${m} ${suffix}`;
        }

        const form = document.getElementById('tripForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "جاري الحفظ...";
            btn.disabled = true;

            const tripData = {
                origin: document.getElementById('origin').value,
                destination: document.getElementById('destination').value,
                trip_type: document.querySelector('input[name="trip_type"]:checked').value,
                departure_time: formatTime12(document.getElementById('departure_time').value),
                return_time: formatTime12(document.getElementById('return_time').value),
                whatsapp_number: "2" + document.getElementById('whatsapp').value,
                seats_available: parseInt(document.getElementById('seats').value),
                price_per_seat: document.getElementById('price').value ? document.getElementById('price').value + " ج.م" : "غير محدد",
                notes: document.getElementById('notes').value
            };

            const { error } = await _supabase.from('trips').insert([tripData]);

            if (error) {
                alert("خطأ في الاتصال: " + error.message);
                btn.innerText = "حاول مرة أخرى";
                btn.disabled = false;
            } else {
                alert("تم نشر رحلتك بنجاح على المنصة! 🎉");
                form.reset();
                toggleReturnTime(false);
                btn.innerText = "نشر رحلة أخرى";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
