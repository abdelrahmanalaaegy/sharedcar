<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ShareRide — جاري التحديث</title>
<meta name="theme-color" content="#00a884">

<meta property="og:type" content="website">
<meta property="og:title" content="ShareRide 🚗">
<meta property="og:description" content="جاري تحديث المنصة، هنرجع أحسن قريب">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Tajawal', sans-serif;
    background: #f8fafc;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: white;
    border-radius: 30px;
    padding: 44px 30px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.06);
    border: 1px solid #f1f5f9;
  }
  .icon-circle {
    width: 84px;
    height: 84px;
    background: #e6f7f2;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 22px;
    font-size: 40px;
    animation: pulse-anim 1.8s infinite;
  }
  @keyframes pulse-anim {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.75; }
  }
  h1 {
    color: #0b141a;
    font-size: 22px;
    font-weight: 900;
    margin: 0 0 12px;
  }
  p {
    color: #64748b;
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.9;
    margin: 0 0 26px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #00a884;
    font-weight: 800;
    font-size: 12.5px;
    padding: 10px 18px;
    border-radius: 20px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00a884;
    animation: blink 1.2s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .logo-text {
    margin-top: 28px;
    font-size: 12px;
    font-weight: 900;
    color: #cbd5e1;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon-circle">🚗</div>
      <h1>جاري تحديث المنصة</h1>
      <p>احنا بنشتغل على تحسينات جديدة عشان تجربتك تبقى أسرع وأحسن.<br>هنرجع لكم قريب جدًا.</p>
      <div class="badge">
        <span class="dot"></span>
        الشغل جاري دلوقتي
      </div>
      <div class="logo-text">ShareRide</div>
    </div>
  </div>
</body>
</html>
