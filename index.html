<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareRide - المنصة الاحترافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; }
        .tab-active { color: #00a884; border-bottom: 3px solid #00a884; }
        .form-input { width: 100%; padding: 0.9rem; background-color: #f8fafc; border-radius: 1rem; border: 1px solid #e2e8f0; outline: none; transition: 0.3s; font-size: 14px; }
        .form-input:focus { border-color: #00a884; background-color: white; box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.1); }
        .trip-card { background: white; border-radius: 1.5rem; padding: 1.2rem; margin-bottom: 1rem; border: 1px solid #e2e8f0; position: relative; }
        .role-badge { position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50 p-4">
        <h1 class="text-xl font-extrabold text-[#00a884] text-center italic">ShareRide 🚗</h1>
        <div class="flex justify-around mt-4 text-sm">
            <button id="btn-search" onclick="switchTab('search')" class="pb-2 font-bold tab-active">🔍 البحث عن رحلة</button>
            <button id="btn-post" onclick="switchTab('post')" class="pb-2 font-bold text-gray-400">➕ انشر طلب/عرض</button>
        </div>
    </header>

    <div class="max-w-md mx-auto p-4">
        
        <!-- SECTION 1: البحث -->
        <div id="section-search">
            <div class="bg-white p-4 rounded-2xl shadow-sm mb-6 border space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <select id="search-origin" class="form-input text-xs"><option value="">كل المناطق (مِن)</option></select>
                    <select id="search-dest" class="form-input text-xs"><option value="">كل المناطق (إلى)</option></select>
                </div>
                <button onclick="loadTrips()" class="w-full bg-[#00a884] text-white p-3 rounded-xl font-bold active:scale-95 transition-all">تحديث النتائج 🔄</button>
            </div>
            <div id="trips-container"></div>
        </div>

        <!-- SECTION 2: النشر -->
        <div id="section-post" class="hidden">
            <div class="bg-white p-5 rounded-[2rem] shadow-sm border">
                <form id="tripForm" class="space-y-4">
                    <!-- اختيار الدور -->
                    <div class="bg-gray-100 p-1 rounded-xl flex gap-1 mb-2">
                        <button type="button" id="role-captain" onclick="setRole('captain')" class="flex-1 p-2 rounded-lg font-bold text-sm bg-white shadow-sm text-[#00a884]">أنا كابتن 🚗</button>
                        <button type="button" id="role-passenger" onclick="setRole('passenger')" class="flex-1 p-2 rounded-lg font-bold text-sm text-gray-500">أنا راكب 🙋‍♂️</button>
                    </div>
                    <input type="hidden" id="user_role" value="captain">

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold mb-1 text-gray-600">📍 من</label>
                            <select id="origin" required class="form-input"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1 text-gray-600">🎯 إلى</label>
                            <select id="destination" required class="form-input"></select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 border-t pt-3">
                        <div>
                            <label class="block text-xs font-bold mb-1 text-gray-600">🕒 وقت الانطلاق</label>
                            <input type="time" id="departure_time" required class="form-input">
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1 text-gray-600">🕒 وقت العودة</label>
                            <input type="time" id="return_time" class="form-input">
                        </div>
                    </div>

                    <!-- حقول الكابتن فقط -->
                    <div id="captain-only-fields" class="space-y-4 border-t pt-3">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold mb-1 text-gray-600">💺 مقاعد</label>
                                <select id="seats" class="form-input"><option>1</option><option>2</option><option>3</option><option>4</option></select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold mb-1 text-gray-600">❄️ التكييف</label>
                                <select id="has_ac" class="form-input"><option value="true">✅ مكيفة</option><option value="false">❌ بدون تكييف</option></select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1 text-gray-600">💰 السعر (للفرد)</label>
                            <input type="number" id="price" placeholder="ج.م" class="form-input">
                        </div>
                    </div>

                    <!-- ملاحظات واتساب (للجميع) -->
                    <div class="border-t pt-3 space-y-3">
                        <div>
                            <label class="block text-xs font-bold mb-1 text-gray-600">📝 ملاحظات (اختياري)</label>
                            <textarea id="notes" maxlength="300" placeholder="مثال: شنط كبيرة، الالتزام بالمواعيد، غير مدخن.." class="form-input h-20 resize-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1 text-gray-600">💬 رقم واتسابك</label>
                            <input type="tel" id="whatsapp" required placeholder="01xxxxxxxxx" class="form-input">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-[#00a884] text-white p-4 rounded-xl font-bold mt-2 shadow-lg active:scale-95 transition-all">نشر الطلب الآن</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://owzaevvsvwufozynzvin.supabase.co"; 
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93emFldnZzdnd1Zm96eW56dmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MDQ4NTgsImV4cCI6MjEwMTA4MDg1OH0.LRd_ekWBrk_BWDPv1PSmpSD9RygerdeeUCHUOQlwukQ";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        // المناطق الـ 26 بالترتيب المطلوب
        const LOCATIONS = [
            "أكتوبر", "الشيخ زايد", "حدائق أكتوبر", "حدائق الأهرام", "الهرم", "فيصل", 
            "المعادي", "حلوان", "المهندسين", "وسط البلد ومحيطها", "شبرا مصر", 
            "شبرا الخيمة", "المرج", "المرج الجديدة", "عين شمس", "الهايكستب", 
            "جسر السويس", "مصر الجديدة", "التجمع الأول", "التجمع الثالث", 
            "التجمع الخامس", "كايرو فيستيفال", "أكاديمية الشرطة", "الجامعة الأمريكية", 
            "الشروق", "العاصمة الإدارية"
        ];

        // تعبئة القوائم المنسدلة برمجياً لتجنب تكرار الكود
        function fillDropdowns() {
            const selects = ['origin', 'destination', 'search-origin', 'search-dest'];
            selects.forEach(id => {
                const el = document.getElementById(id);
                LOCATIONS.forEach(loc => {
                    const opt = document.createElement('option');
                    opt.value = loc;
                    opt.innerText = loc;
                    el.appendChild(opt);
                });
            });
        }

        function t12(time) {
            if(!time) return null;
            let [h, m] = time.split(':');
            h = parseInt(h);
            const s = h >= 12 ? 'مساءً' : 'صباحاً';
            h = h % 12 || 12;
            return `${h}:${m} ${s}`;
        }

        function setRole(role) {
            document.getElementById('user_role').value = role;
            const captainFields = document.getElementById('captain-only-fields');
            const capBtn = document.getElementById('role-captain');
            const pasBtn = document.getElementById('role-passenger');
            if(role === 'passenger') {
                captainFields.classList.add('hidden');
                pasBtn.className = "flex-1 p-2 rounded-lg font-bold text-sm bg-white shadow-sm text-[#00a884]";
                capBtn.className = "flex-1 p-2 rounded-lg font-bold text-sm text-gray-500";
            } else {
                captainFields.classList.remove('hidden');
                capBtn.className = "flex-1 p-2 rounded-lg font-bold text-sm bg-white shadow-sm text-[#00a884]";
                pasBtn.className = "flex-1 p-2 rounded-lg font-bold text-sm text-gray-500";
            }
        }

        async function loadTrips() {
            const container = document.getElementById('trips-container');
            container.innerHTML = '<p class="text-center text-gray-400 py-10">جاري التحميل...</p>';
            
            const o = document.getElementById('search-origin').value;
            const d = document.getElementById('search-dest').value;

            let query = _supabase.from('trips').select('*').order('created_at', { ascending: false });
            if(o) query = query.eq('origin', o);
            if(d) query = query.eq('destination', d);

            const { data } = await query;

            if(!data || data.length === 0) {
                container.innerHTML = '<div class="bg-white p-10 text-center rounded-2xl border text-gray-400">لا توجد نتائج مطابقة</div>';
                return;
            }

            container.innerHTML = data.map(t => {
                const isCap = t.user_role === 'captain';
                return `
                <div class="trip-card border-l-4 ${isCap ? 'border-l-blue-500' : 'border-l-orange-500'}">
                    <span class="role-badge ${isCap ? 'bg-blue-500 text-white' : 'bg-orange-500 text-white'}">
                        ${isCap ? 'كابتن 🚗' : 'راكب 🙋‍♂️'}
                    </span>
                    <div class="flex justify-between items-start mb-2 pt-4">
                        <div>
                            <h3 class="font-bold text-slate-800">${t.origin} ⬅️ ${t.destination}</h3>
                            <div class="text-[11px] text-gray-500 mt-1 font-bold">
                                🕒 الذهاب: ${t.departure_time} 
                                ${t.return_time ? `<br>🕒 العودة: ${t.return_time}` : ''}
                            </div>
                        </div>
                        ${isCap ? `<div class="text-[#00a884] font-bold">${t.price_per_seat}</div>` : ''}
                    </div>
                    ${t.notes ? `<p class="text-[11px] bg-gray-50 p-2 rounded-lg text-gray-600 mb-3 border-r-2 border-gray-200 italic">"${t.notes}"</p>` : ''}
                    ${isCap ? `
                    <div class="flex gap-3 text-[10px] text-gray-400 font-bold mb-3 border-t pt-2">
                        <span>💺 ${t.seats_available} مقاعد</span>
                        <span>${t.has_ac ? '❄️ مكيفة' : '❌ بلا تكييف'}</span>
                    </div>
                    ` : '<div class="mb-3"></div>'}
                    <a href="https://wa.me/${t.whatsapp_number}" target="_blank"
                       class="flex items-center justify-center gap-2 w-full bg-[#25D366] text-white py-3 rounded-xl font-bold active:scale-95 transition-all text-sm">
                       💬 تواصل الآن
                    </a>
                </div>
            `}).join('');
        }

        document.getElementById('tripForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const role = document.getElementById('user_role').value;
            btn.innerText = "جاري النشر..."; btn.disabled = true;

            const tripData = {
                user_role: role,
                origin: document.getElementById('origin').value,
                destination: document.getElementById('destination').value,
                trip_type: "one_way",
                departure_time: t12(document.getElementById('departure_time').value),
                return_time: t12(document.getElementById('return_time').value),
                whatsapp_number: "2" + document.getElementById('whatsapp').value,
                notes: document.getElementById('notes').value,
                seats_available: role === 'captain' ? parseInt(document.getElementById('seats').value) : 0,
                has_ac: role === 'captain' ? document.getElementById('has_ac').value === "true" : false,
                price_per_seat: role === 'captain' ? (document.getElementById('price').value + " ج.م") : "طلب راكب"
            };

            const { error } = await _supabase.from('trips').insert([tripData]);
            if (!error) {
                alert("تم النشر بنجاح!");
                document.getElementById('tripForm').reset();
                switchTab('search');
            } else { alert("خطأ: " + error.message); }
            btn.innerText = "نشر الطلب الآن"; btn.disabled = false;
        });

        function switchTab(tab) {
            document.getElementById('section-post').classList.toggle('hidden', tab === 'search');
            document.getElementById('section-search').classList.toggle('hidden', tab === 'post');
            document.getElementById('btn-search').classList.toggle('tab-active', tab === 'search');
            document.getElementById('btn-post').classList.toggle('tab-active', tab === 'post');
            if(tab === 'search') loadTrips();
        }

        fillDropdowns();
        loadTrips();
    </script>
</body>
</html>
