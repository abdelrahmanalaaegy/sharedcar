<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareRide - المنصة الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; }
        .tab-active { color: #00a884; border-bottom: 3px solid #00a884; }
        .form-input { width: 100%; padding: 0.9rem; background-color: #f8fafc; border-radius: 1rem; border: 1px solid #e2e8f0; outline: none; transition: 0.3s; }
        .form-input:focus { border-color: #00a884; background-color: white; }
        .trip-card { background: white; border-radius: 1.5rem; padding: 1.2rem; margin-bottom: 1rem; border: 1px solid #e2e8f0; position: relative; overflow: hidden; }
        .role-badge { position: absolute; left: 0; top: 0; padding: 4px 12px; border-bottom-right-radius: 12px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50 p-4">
        <h1 class="text-xl font-extrabold text-[#00a884] text-center">ShareRide 🚗</h1>
        <div class="flex justify-around mt-4">
            <button id="btn-search" onclick="switchTab('search')" class="pb-2 font-bold tab-active">🔍 البحث</button>
            <button id="btn-post" onclick="switchTab('post')" class="pb-2 font-bold text-gray-400">➕ انشر طلب/عرض</button>
        </div>
    </header>

    <div class="max-w-md mx-auto p-4">
        
        <!-- SECTION 1: البحث -->
        <div id="section-search">
            <div class="bg-white p-4 rounded-2xl shadow-sm mb-6 space-y-3 border">
                <div class="grid grid-cols-2 gap-2 text-xs font-bold text-gray-500 mb-1">
                    <span>من منطقة:</span>
                    <span>إلى منطقة:</span>
                </div>
                <div class="flex gap-2">
                    <select id="search-origin" class="form-input text-xs">
                        <option value="">كل المناطق</option>
                        <option>أكتوبر</option><option>الشيخ زايد</option><option>المعادي</option><option>التجمع الخامس</option><option>المهندسين</option><option>مصر الجديدة</option>
                    </select>
                    <select id="search-dest" class="form-input text-xs">
                        <option value="">كل المناطق</option>
                        <option>أكتوبر</option><option>الشيخ زايد</option><option>المعادي</option><option>التجمع الخامس</option><option>المهندسين</option><option>مصر الجديدة</option>
                    </select>
                </div>
                <button onclick="loadTrips()" class="w-full bg-[#00a884] text-white p-3 rounded-xl font-bold">تحديث النتائج 🔄</button>
            </div>

            <div id="trips-container">
                <p class="text-center text-gray-400 py-10">جاري تحميل الرحلات...</p>
            </div>
        </div>

        <!-- SECTION 2: النشر -->
        <div id="section-post" class="hidden">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border">
                <form id="tripForm" class="space-y-4">
                    <!-- اختيار الدور -->
                    <div class="bg-gray-100 p-1 rounded-xl flex gap-1">
                        <button type="button" id="role-captain" onclick="setRole('captain')" class="flex-1 p-2 rounded-lg font-bold text-sm bg-white shadow-sm text-[#00a884]">أنا كابتن 🚗</button>
                        <button type="button" id="role-passenger" onclick="setRole('passenger')" class="flex-1 p-2 rounded-lg font-bold text-sm text-gray-500">أنا راكب 🙋‍♂️</button>
                    </div>
                    <input type="hidden" id="user_role" value="captain">

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold mb-1">📍 من</label>
                            <select id="origin" required class="form-input text-sm"><option value="">اختر...</option><option>أكتوبر</option><option>الشيخ زايد</option><option>المعادي</option><option>التجمع الخامس</option><option>المهندسين</option><option>مصر الجديدة</option></select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1">🎯 إلى</label>
                            <select id="destination" required class="form-input text-sm"><option value="">اختر...</option><option>أكتوبر</option><option>الشيخ زايد</option><option>المعادي</option><option>التجمع الخامس</option><option>المهندسين</option><option>مصر الجديدة</option></select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold mb-1">🕒 وقت التحرك</label>
                            <input type="time" id="departure_time" required class="form-input">
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1">💺 مقاعد</label>
                            <select id="seats" class="form-input text-sm"><option>1</option><option>2</option><option>3</option><option>4</option></select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold mb-1">❄️ التكييف</label>
                            <select id="has_ac" class="form-input text-sm">
                                <option value="true">✅ مكيفة</option>
                                <option value="false">❌ غير مكيفة</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1">💰 السعر (للفرد)</label>
                            <input type="number" id="price" placeholder="ج.م" class="form-input">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold mb-1">💬 رقم واتساب</label>
                        <input type="tel" id="whatsapp" required placeholder="01xxxxxxxxx" class="form-input">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-[#00a884] text-white p-4 rounded-xl font-bold mt-4 shadow-lg active:scale-95 transition-all">نشر الطلب الآن</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // إعدادات الربط
        const SB_URL = "https://owzaevvsvwufozynzvin.supabase.co"; 
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93emFldnZzdnd1Zm96eW56dmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MDQ4NTgsImV4cCI6MjEwMTA4MDg1OH0.LRd_ekWBrk_BWDPv1PSmpSD9RygerdeeUCHUOQlwukQ";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        // تبديل الدور (كابتن/راكب)
        function setRole(role) {
            document.getElementById('user_role').value = role;
            const capBtn = document.getElementById('role-captain');
            const pasBtn = document.getElementById('role-passenger');
            
            if(role === 'captain') {
                capBtn.classList.add('bg-white', 'shadow-sm', 'text-[#00a884]');
                pasBtn.classList.remove('bg-white', 'shadow-sm', 'text-[#00a884]');
                pasBtn.classList.add('text-gray-500');
            } else {
                pasBtn.classList.add('bg-white', 'shadow-sm', 'text-[#00a884]');
                capBtn.classList.remove('bg-white', 'shadow-sm', 'text-[#00a884]');
                capBtn.classList.add('text-gray-500');
            }
        }

        // تبديل التبويبات
        function switchTab(tab) {
            if(tab === 'post') {
                document.getElementById('section-post').classList.remove('hidden');
                document.getElementById('section-search').classList.add('hidden');
                document.getElementById('btn-post').classList.add('tab-active');
                document.getElementById('btn-search').classList.remove('tab-active');
            } else {
                document.getElementById('section-post').classList.add('hidden');
                document.getElementById('section-search').classList.remove('hidden');
                document.getElementById('btn-post').classList.remove('tab-active');
                document.getElementById('btn-search').classList.add('tab-active');
                loadTrips();
            }
        }

        // تحميل الرحلات
        async function loadTrips() {
            const container = document.getElementById('trips-container');
            const originFilter = document.getElementById('search-origin').value;
            const destFilter = document.getElementById('search-dest').value;

            let query = _supabase.from('trips').select('*').order('created_at', { ascending: false });
            
            if(originFilter) query = query.eq('origin', originFilter);
            if(destFilter) query = query.eq('destination', destFilter);

            const { data, error } = await query;

            if(data.length === 0) {
                container.innerHTML = `<div class="text-center py-10 bg-white rounded-2xl border"><p class="text-gray-400">لا توجد نتائج مطابقة</p></div>`;
                return;
            }

            container.innerHTML = data.map(trip => {
                const isCaptain = trip.user_role === 'captain';
                const roleText = isCaptain ? 'كابتن' : 'راكب';
                const roleColor = isCaptain ? 'bg-blue-500 text-white' : 'bg-orange-500 text-white';
                
                return `
                <div class="trip-card">
                    <span class="role-badge ${roleColor}">${roleText}</span>
                    <div class="flex justify-between items-start mb-2 mt-2">
                        <div>
                            <h3 class="font-bold text-lg text-slate-800">${trip.origin} ⬅️ ${trip.destination}</h3>
                            <p class="text-xs text-gray-500">🕒 التحرك: ${trip.departure_time}</p>
                        </div>
                        <div class="text-left">
                            <span class="text-[#00a884] font-bold text-lg">${trip.price_per_seat || 'مجاني'}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 text-[10px] text-gray-500 mb-4 font-bold border-t pt-2">
                        <span>💺 ${trip.seats_available} مقاعد</span>
                        <span>${trip.has_ac ? '❄️ مكيفة' : '❌ بدون تكييف'}</span>
                    </div>
                    <a href="https://wa.me/${trip.whatsapp_number}" target="_blank"
                       class="flex items-center justify-center gap-2 w-full bg-[#25D366] text-white py-3 rounded-xl font-bold shadow-sm active:scale-95 transition-all">
                       💬 تواصل الآن
                    </a>
                </div>
            `}).join('');
        }

        // إرسال البيانات
        document.getElementById('tripForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "جاري الحفظ...";
            btn.disabled = true;

            const tripData = {
                user_role: document.getElementById('user_role').value,
                origin: document.getElementById('origin').value,
                destination: document.getElementById('destination').value,
                trip_type: "one_way",
                departure_time: document.getElementById('departure_time').value,
                whatsapp_number: "2" + document.getElementById('whatsapp').value,
                seats_available: parseInt(document.getElementById('seats').value),
                has_ac: document.getElementById('has_ac').value === "true",
                price_per_seat: document.getElementById('price').value ? document.getElementById('price').value + " ج.م" : "مجاني"
            };

            const { error } = await _supabase.from('trips').insert([tripData]);

            if (!error) {
                alert("تم النشر بنجاح! 🎉");
                document.getElementById('tripForm').reset();
                switchTab('search');
            } else {
                alert("خطأ: " + error.message);
            }
            btn.innerText = "نشر الطلب الآن";
            btn.disabled = false;
        });

        // تشغيل التحميل عند الفتح
        loadTrips();
    </script>
</body>
</html>
