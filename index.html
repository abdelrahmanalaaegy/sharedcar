<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sharride App</title>

    <!-- Meta Tags & PWA -->
    <meta property="og:title" content="Sharride - شارك رحلتك">
    <meta property="og:description" content="اطلب أو انشر رحلتك بسهولة وأمان مع Sharride">
    <meta property="og:image" content="https://abdelrahmanalaaegy.github.io/sharedcar/preview.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00a884">
    <link rel="apple-touch-icon" href="logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loading-overlay">
        <h1 class="text-4xl font-black text-[#00a884] mb-2 italic">Sharride</h1>
        <p class="text-gray-400 font-bold pulse">جاري تشغيل المحرك... 🚗</p>
    </div>

    <!-- Navigation -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-[100] p-4 text-center border-b border-slate-100 rounded-b-[30px] shadow-sm">
        <div class="flex justify-around items-center max-w-md mx-auto">
            <button onclick="window.uiTab('home')" id="nav-home" class="nav-btn active flex flex-col items-center gap-1"><span class="text-lg">🏠</span><span class="text-[9px]">الرئيسية</span></button>
            <button onclick="window.uiTab('search')" id="nav-search" class="nav-btn text-slate-400 flex flex-col items-center gap-1"><span class="text-lg">🔍</span><span class="text-[9px]">استكشاف</span></button>
            <button onclick="window.uiTab('post')" id="nav-post" class="nav-btn text-slate-400 flex flex-col items-center gap-1"><span class="text-lg">➕</span><span class="text-[9px]">سجل مشوارك</span></button>
            <button onclick="window.uiTab('my')" id="nav-my" class="nav-btn text-slate-400 flex flex-col items-center gap-1"><span class="text-lg">👤 رحلاتي</span></button>
            <button onclick="window.openNotifications()" id="nav-notif" class="relative text-slate-400 flex flex-col items-center gap-1"><span class="text-lg">🔔</span><span class="text-[9px]">إشعارات</span><span id="notif-badge" class="hidden absolute -top-1 left-2 bg-red-600 text-white text-[9px] font-black rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center">0</span></button>
            <button onclick="window.uiTab('admin')" id="nav-admin" class="nav-btn text-slate-400 flex flex-col items-center gap-1" style="display:none;"><span class="text-lg">⚙️</span><span class="text-[9px]">الإدارة</span></button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 min-h-screen">
        <div id="view-home" class="tab-content active py-2">
            <div class="py-8 px-6 bg-gradient-to-br from-[#00a884] to-[#128c7e] rounded-[2.5rem] text-white shadow-xl text-right">
                <h1 class="text-2xl font-black mb-2 leading-snug tracking-tight">يمكن المشوار اللي بتدور عليه موجود هنا 🚗</h1>
            </div>
            <div id="home-phone-card" class="mt-6 bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm text-right"></div>
        </div>

        <div id="view-search" class="tab-content text-center">
            <div id="search-filter-bar" class="bg-white p-5 rounded-[2.2rem] mb-6 border shadow-sm">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <select id="f-o" onchange="window.apiGetTrips()" class="form-input text-xs"></select>
                    <select id="f-d" onchange="window.apiGetTrips()" class="form-input text-xs"></select>
                </div>
            </div>
            <div id="list-public"></div>
        </div>

        <div id="view-post" class="tab-content">
            <form id="postForm" onsubmit="window.apiPost(event)" class="space-y-4 text-right bg-white p-5 rounded-[2.2rem] border shadow-sm">
                <h2 class="text-center font-black text-[#00a884] text-lg italic">سجل مشوارك 📝</h2>
                <div class="grid grid-cols-2 gap-3 font-bold text-xs"><select id="in-o" required class="form-input"></select><select id="in-d" required class="form-input"></select></div>
                <input type="number" id="in-price" placeholder="السعر لليوم" class="form-input text-center">
                <button type="submit" id="btn-pub" class="btn-green p-4 text-xl font-black italic shadow-lg">نشر المشوار الآن 🚀</button>
            </form>
        </div>

        <div id="view-my" class="tab-content text-center">
            <div id="my-phone-card"></div>
            <div id="list-mine"></div>
        </div>
    </main>

    <!-- الربط مع الملفات المنفصلة JS -->
    <script type="module">
        import { sb } from './js/supabase.js';
        import { fillDropdowns } from './js/routes.js';
        import { checkAdminSession, changeMyPhone, saveHomePhone, renderMyPhoneCard, renderHomePhoneCard } from './js/auth.js';
        import { openNotifications, closeNotifications, openFofi, closeFofi } from './js/chat.js';
        import { apiGetTrips, apiGetMyTrips, apiPost, saveEdit, getLocalTokens } from './js/trips.js';

        // ربط جميع الدوال الحساسة بالنطاق العام window لعمل أزرار HTML بدون مشاكل
        window.sb = sb;
        window.changeMyPhone = changeMyPhone;
        window.saveHomePhone = saveHomePhone;
        window.openNotifications = openNotifications;
        window.closeNotifications = closeNotifications;
        window.openFofi = openFofi;
        window.closeFofi = closeFofi;
        window.apiGetTrips = apiGetTrips;
        window.apiGetMyTrips = apiGetMyTrips;
        window.apiPost = apiPost;
        window.saveEdit = saveEdit;
        window.getLocalTokens = getLocalTokens;

        window.uiTab = function(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            const target = document.getElementById('view-' + id);
            if (target) target.classList.add('active');
            if (id === 'search') apiGetTrips();
            if (id === 'my') { apiGetMyTrips(); renderMyPhoneCard(); }
        };

        const hideOverlay = () => {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) overlay.style.display = 'none';
        };

        window.onload = async function() {
            try {
                fillDropdowns();
                renderHomePhoneCard();
                await checkAdminSession();
                apiGetTrips();
            } catch (err) {
                console.error("خطأ في التحميل:", err);
            } finally {
                // إخفاء الشاشة دائماً مهما حدث
                hideOverlay();
            }
        };

        // أمان إضافي: إخفاء الشاشة بعد ثانية كحد أقصى إذا علق أي شيء
        setTimeout(hideOverlay, 1000);
    </script>
</body>
</html>
