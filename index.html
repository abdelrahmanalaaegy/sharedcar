<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShareRide - طريقنا واحد</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00A884">
    <link rel="apple-touch-icon" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- شاشة التحميل الذكية -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center transition-opacity duration-500">
        <h1 class="text-4xl font-black text-[#00A884] italic">ShareRide</h1>
        <p id="loading-text" class="text-slate-400 mt-2 font-bold animate-pulse">جاري تشغيل المحرك... 🚗</p>
    </div>

    <!-- الرأس الثابت -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-[100] border-b border-slate-100 p-4 rounded-b-[25px]">
        <div class="max-w-md mx-auto">
            <h1 class="text-2xl font-black text-[#00A884] text-center italic mb-4">ShareRide 🚗</h1>
            <nav class="flex justify-around text-[11px] font-bold">
                <button onclick="ui.switchTab('search')" id="nav-search" class="nav-btn active">🔍 استكشاف</button>
                <button onclick="ui.switchTab('post')" id="nav-post" class="nav-btn text-slate-400">➕ سجل مشوارك</button>
                <button onclick="ui.switchTab('my')" id="nav-my" class="nav-btn text-slate-400 relative">👤 رحلاتي</button>
                <button onclick="uiTab('admin')" id="nav-admin" class="nav-btn text-slate-400">⚙️ الإدارة</button>
            </nav>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 min-h-screen">
        
        <!-- قسم البحث والمطابقة -->
        <div id="tab-search" class="tab-content active text-center">
            <div class="bg-white p-5 rounded-[2.2rem] mb-6 border shadow-sm">
                <div class="bg-gray-100 p-1 rounded-xl flex gap-1 mb-4">
                    <button onclick="ui.setSearchRole('captain')" id="search-role-cap" class="flex-1 py-3 rounded-lg font-black text-[12px] bg-white text-[#00A884] shadow-sm">🚗 رحلات الكباتن</button>
                    <button onclick="ui.setSearchRole('passenger')" id="search-role-pas" class="flex-1 py-3 rounded-lg font-black text-[12px] text-gray-500">🙋‍♂️ رحلات الركاب</button>
                </div>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <select id="f-o" onchange="app.fetchTrips()" class="form-input text-xs font-bold"></select>
                    <select id="f-d" onchange="apiGetTrips()" class="form-input text-xs font-bold"></select>
                </div>
                <p id="top-guide-banner" class="text-[10px] text-gray-400 font-bold italic">ملقيتش رحلة في طريقك؟ سجل مشوارك دلوقتي!</p>
            </div>
            <div id="list-public"></div>
        </div>

        <!-- قسم تسجيل مشوار جديد -->
        <div id="tab-post" class="tab-content hidden">
            <div class="bg-white p-6 rounded-[2.5rem] border shadow-sm">
                <form id="postForm" onsubmit="app.handlePost(event)" class="space-y-4">
                    <div class="flex bg-gray-100 p-1 rounded-xl">
                        <button type="button" id="role-cap" onclick="ui.setFormRole('captain')" class="flex-1 py-2 rounded-lg font-bold text-xs bg-white text-[#00A884] shadow-sm">أنا كابتن 🚗</button>
                        <button type="button" id="role-pas" onclick="ui.setFormRole('passenger')" class="flex-1 py-2 rounded-lg font-bold text-xs text-gray-500">أنا راكب 🙋‍♂️</button>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <select id="in-o" required class="form-input border-emerald-500/20"></select>
                        <select id="in-d" required class="form-input border-emerald-500/20"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-3 pt-2 text-right">
                        <div class="bg-slate-50 p-2 rounded-xl border border-slate-100">
                            <label class="text-[9px] font-black text-[#00A884] block mb-1">موعد ذهاب</label>
                            <div class="flex gap-1" dir="ltr">
                                <select id="h1" class="bg-transparent font-bold text-xs outline-none"></select>
                                <select id="m1" class="bg-transparent font-bold text-xs outline-none"></select>
                                <select id="p1" class="bg-transparent font-bold text-xs outline-none"><option>صباحاً</option><option>مساءً</option></select>
                            </div>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-xl border border-slate-100">
                            <label class="text-[9px] font-black text-slate-400 block mb-1">موعد عودة</label>
                            <div class="flex gap-1" dir="ltr">
                                <select id="h2" class="bg-transparent font-bold text-xs outline-none"></select>
                                <select id="m2" class="bg-transparent font-bold text-xs outline-none"></select>
                                <select id="p2" class="bg-transparent font-bold text-xs outline-none"><option>صباحاً</option><option>مساءً</option></select>
                            </div>
                        </div>
                    </div>
                    <div id="cap-only-fields" class="grid grid-cols-2 gap-3">
                        <select id="in-seats" class="form-input font-bold text-xs"></select>
                        <input type="number" id="in-price" placeholder="السعر لليوم" class="form-input font-bold">
                    </div>
                    <textarea id="in-notes" placeholder="ملاحظات (الشنط، المواعيد...)" class="form-input h-24 text-right resize-none"></textarea>
                    <input type="tel" id="in-phone" required placeholder="رقم واتسابك (01...)" class="form-input border-2 border-[#00A884] text-lg font-black italic">
                    <button type="submit" id="btn-pub" class="btn-green w-full text-xl shadow-xl shadow-emerald-100">سجل مشوارك الآن 🚀</button>
                </form>
            </div>
        </div>

        <!-- باقي الأقسام (رحلاتي والإدارة) مدمجة في app.js -->
        <div id="tab-my" class="tab-content hidden"></div>
        <div id="tab-admin" class="tab-content hidden"></div>

    </main>

    <!-- مودال النجاح وكود الإدارة -->
    <div id="mgmt-modal" class="hidden fixed inset-0 z-[500] bg-slate-900/90 flex items-center justify-center p-6 text-center">
        <div class="bg-white rounded-[3rem] p-8 w-full max-w-sm border-4 border-[#00A884] space-y-4">
            <h2 class="text-2xl font-black mb-2">تم الحفظ بنجاح! ✅</h2>
            <p class="text-slate-500 font-bold text-sm">احتفظ بهذا الكود لتعديل رحلتك لاحقاً:</p>
            <div id="mgmt-code-display" class="bg-slate-100 p-4 rounded-2xl text-2xl font-black text-slate-800 border-2 border-dashed border-emerald-300 tracking-widest"></div>
            <button onclick="ui.closeMgmtModal()" class="btn-green w-full">فهمت، ابدأ الآن</button>
        </div>
    </div>

    <!-- نموذج التعديل الطافي -->
    <div id="global-edit-form" class="hidden fixed inset-0 z-[400] bg-black/60 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#fffdf5] border-2 border-amber-500 p-6 rounded-[2.5rem] w-full max-w-md shadow-2xl space-y-4 overflow-y-auto max-h-[90vh] text-right">
            <h3 class="font-black text-center text-amber-800 italic text-xl border-b border-amber-200 pb-2">📝 تعديل الرحلة</h3>
            <div id="edit-form-content" class="space-y-4"></div>
            <div class="flex gap-2 pt-2">
                <button onclick="app.saveEdit()" class="flex-1 bg-amber-600 text-white p-4 rounded-2xl font-black shadow-lg">حفظ التغييرات</button>
                <button onclick="ui.closeEdit()" class="bg-gray-400 text-white p-4 rounded-2xl font-black">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
