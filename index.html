<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShareRide - النسخة الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; padding-bottom: 80px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-btn.active { color: #00a884; border-bottom: 4px solid #00a884; font-weight: 900; }
        .form-input { width: 100%; padding: 12px; border-radius: 15px; border: 1px solid #cbd5e1; outline: none; background: white; font-size: 14px; }
        .trip-card { background: white; border-radius: 20px; padding: 16px; margin-bottom: 16px; border: 1px solid #e2e8f0; position: relative; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .role-badge { position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: 8px; font-size: 9px; font-weight: 900; color: white; }
        .time-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 6px 12px; }
        .time-label { font-size: 10px; font-weight: 800; color: #00a884; margin-bottom: 2px; display: block; }
        .btn-green { background: #00a884; color: white; border-radius: 15px; font-weight: bold; width: 100%; padding: 14px; }
        .content-fade { opacity: 0.5; filter: grayscale(0.8); }
        .edit-overlay { background: #fffbeb; border: 2px solid #f59e0b; padding: 15px; border-radius: 20px; margin-bottom: 15px; }
        .feature-badge { background: #f1f5f9; color: #475569; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <header class="bg-white shadow-sm sticky top-0 z-[100] p-4 text-center">
        <h1 class="text-xl font-black text-[#00a884] mb-4 italic">ShareRide 🚗</h1>
        <div class="flex justify-around text-[10px] font-bold">
            <button onclick="uiTab('search')" id="nav-search" class="nav-btn pb-2 active">🔍 البحث</button>
            <button onclick="uiTab('post')" id="nav-post" class="nav-btn pb-2 text-gray-400">➕ انشر</button>
            <button onclick="uiTab('my')" id="nav-my" class="nav-btn pb-2 text-gray-400">👤 رحلاتي</button>
            <button onclick="uiTab('admin')" id="nav-admin" class="nav-btn pb-2 text-gray-400">⚙️ الإدارة</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">

        <!-- نموذج التعديل المشترك (يظهر عند الضغط على تعديل) -->
        <div id="global-edit-form" class="hidden edit-overlay text-right space-y-3">
            <h3 class="font-black text-center border-b border-amber-200 pb-2 mb-2 text-amber-800">📝 تعديل بيانات الرحلة</h3>
            <input type="hidden" id="edit-id">
            <input type="hidden" id="edit-mode"> <!-- 'my' or 'admin' -->
            
            <div class="grid grid-cols-2 gap-2">
                <select id="edit-o" class="form-input text-xs font-bold"></select>
                <select id="edit-d" class="form-input text-xs font-bold"></select>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="edit-t1" placeholder="وقت الذهاب" class="form-input text-xs font-bold">
                <input type="text" id="edit-t2" placeholder="وقت العودة" class="form-input text-xs font-bold">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="edit-price" placeholder="السعر" class="form-input text-xs font-bold">
                <select id="edit-ac" class="form-input text-xs font-bold">
                    <option value="true">✅ مكيفة</option>
                    <option value="false">❌ بدون تكييف</option>
                </select>
            </div>
            <textarea id="edit-notes" placeholder="الملاحظات" class="form-input h-16 text-xs font-bold"></textarea>
            
            <div class="flex gap-2 pt-2">
                <button onclick="saveEdit()" class="flex-1 bg-amber-600 text-white p-3 rounded-xl font-bold shadow-md">حفظ التعديلات</button>
                <button onclick="document.getElementById('global-edit-form').classList.add('hidden')" class="bg-gray-400 text-white p-3 rounded-xl font-bold">إلغاء</button>
            </div>
        </div>

        <!-- 1. البحث -->
        <div id="view-search" class="tab-content active">
            <div class="bg-white p-4 rounded-2xl mb-6 border shadow-sm text-center">
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <select id="f-o" class="form-input text-xs font-bold"></select>
                    <select id="f-d" class="form-input text-xs font-bold"></select>
                </div>
                <button onclick="apiGetTrips()" class="btn-green">تحديث النتائج 🔄</button>
            </div>
            <div id="list-public"></div>
        </div>

        <!-- 2. النشر -->
        <div id="view-post" class="tab-content">
            <div class="bg-white p-5 rounded-[2.2rem] shadow-sm border">
                <form id="postForm" onsubmit="apiPost(event)" class="space-y-4">
                    <div class="flex bg-gray-100 p-1 rounded-xl">
                        <button type="button" id="role-cap" onclick="uiRole('captain')" class="flex-1 py-2 rounded-lg font-bold text-xs bg-white text-[#00a884] shadow-sm">أنا كابتن 🚗</button>
                        <button type="button" id="role-pas" onclick="uiRole('passenger')" class="flex-1 py-2 rounded-lg font-bold text-xs text-gray-500">أنا راكب 🙋‍♂️</button>
                    </div>
                    <input type="hidden" id="in-role" value="captain">
                    
                    <div class="grid grid-cols-2 gap-3 text-xs font-bold">
                        <select id="in-o" required class="form-input"></select>
                        <select id="in-d" required class="form-input"></select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="time-box"><label class="time-label">موعد الانطلاق 🕒</label><input type="time" id="in-t1" required class="w-full bg-transparent outline-none font-bold text-sm"></div>
                        <div class="time-box"><label class="time-label">موعد العودة 🕒</label><input type="time" id="in-t2" class="w-full bg-transparent outline-none font-bold text-sm"></div>
                    </div>

                    <div id="cap-box" class="space-y-4 border-t pt-4">
                        <div class="grid grid-cols-2 gap-3">
                            <select id="in-seats" class="form-input text-xs font-bold"><option value="1">1 مقعد متاح</option><option value="2">2 مقعد متاح</option><option value="3">3 مقاعد متاحة</option><option value="4">4 مقاعد متاحة</option></select>
                            <select id="in-ac" class="form-input text-xs font-bold"><option value="true">✅ مكيفة</option><option value="false">❌ بلا تكييف</option></select>
                        </div>
                        <input type="number" id="in-price" placeholder="السعر للفرد (ج.م)" class="form-input font-bold text-center">
                    </div>

                    <div class="border-t pt-4">
                        <textarea id="in-notes" maxlength="300" placeholder="ملاحظات (مثل: متاح مكان للشنط..)" class="form-input h-20 mb-3"></textarea>
                        <input type="tel" id="in-phone" required placeholder="رقم واتسابك (01xxxxxxxxx)" class="form-input text-center font-black border-2 border-[#00a884]">
                    </div>

                    <button type="submit" id="btn-pub" class="btn-green p-4 text-lg shadow-lg">نشر الآن 🚀</button>
                </form>
            </div>
        </div>

        <!-- 3. رحلاتي -->
        <div id="view-my" class="tab-content">
            <div class="bg-white p-6 rounded-2xl border-2 border-black mb-6 text-center shadow-sm">
                <h2 class="font-bold mb-3">إدارة رحلاتي 👤</h2>
                <input type="tel" id="my-phone" placeholder="01xxxxxxxxx" class="form-input text-center mb-3 font-bold border-gray-400">
                <button onclick="apiGetMyTrips()" class="w-full bg-black text-white p-3 rounded-xl font-bold">عرض رحلاتي الخاصة</button>
            </div>
            <div id="list-mine"></div>
        </div>

        <!-- 4. الإدارة -->
        <div id="view-admin" class="tab-content text-center">
            <div id="admin-auth" class="bg-white p-8 rounded-2xl border shadow-sm">
                <input type="password" id="admin-pass" placeholder="كلمة المرور" class="form-input text-center mb-4 border-2">
                <button onclick="apiAdminLogin()" class="w-full bg-black text-white p-3 rounded-xl font-bold">دخول المدير</button>
            </div>
            <div id="admin-panel" class="hidden">
                <div class="bg-white p-4 rounded-2xl border mb-4 shadow-sm text-right">
                    <input type="tel" id="admin-search-phone" placeholder="بحث برقم الهاتف..." class="form-input font-bold">
                    <button onclick="apiAdminReload()" class="bg-[#00a884] text-white w-full mt-2 p-2 rounded-xl font-bold text-sm">بحث</button>
                </div>
                <div id="list-admin"></div>
            </div>
        </div>

    </main>

    <script>
        const SB_URL = "https://owzaevvsvwufozynzvin.supabase.co"; 
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93emFldnZzdnd1Zm96eW56dmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MDQ4NTgsImV4cCI6MjEwMTA4MDg1OH0.LRd_ekWBrk_BWDPv1PSmpSD9RygerdeeUCHUOQlwukQ";
        const sb = supabase.createClient(SB_URL, SB_KEY);

        const LOCS = ["أكتوبر", "الشيخ زايد", "حدائق أكتوبر", "حدائق الأهرام", "الهرم", "فيصل", "المعادي", "حلوان", "المهندسين", "وسط البلد ومحيطها", "شبرا مصر", "شبرا الخيمة", "المرج", "المرج الجديدة", "عين شمس", "الهايكستب", "جسر السويس", "مدينة نصر", "مصر الجديدة", "التجمع الأول", "التجمع الثالث", "التجمع الخامس", "كايرو فيستيفال", "أكاديمية الشرطة", "الجامعة الأمريكية", "الشروق", "العاصمة الإدارية"];

        function uiTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active', 'text-[#00a884]'));
            document.getElementById('nav-' + id).classList.add('active');
            if(id === 'search') apiGetTrips();
        }

        function uiRole(r) {
            document.getElementById('in-role').value = r;
            document.getElementById('cap-box').classList.toggle('hidden', r === 'passenger');
            document.getElementById('role-cap').className = r === 'captain' ? "flex-1 py-2 rounded-lg font-bold text-xs bg-white text-[#00a884] shadow-sm" : "flex-1 py-2 rounded-lg font-bold text-xs text-gray-500";
            document.getElementById('role-pas').className = r === 'passenger' ? "flex-1 py-2 rounded-lg font-bold text-xs bg-white text-[#00a884] shadow-sm" : "flex-1 py-2 rounded-lg font-bold text-xs text-gray-500";
        }

        function t12(t) {
            if(!t) return null;
            let [h, m] = t.split(':'); h = parseInt(h);
            const s = h >= 12 ? 'مساءً' : 'صباحاً'; h = h % 12 || 12;
            return `${h}:${m} ${s}`;
        }

        async function apiGetTrips() {
            const list = document.getElementById('list-public');
            list.innerHTML = '<p class="text-center py-20 text-gray-400 font-bold">جاري تحديث الرحلات...</p>';
            let q = sb.from('trips').select('*').eq('status', 'active').order('origin', {ascending: true}).order('created_at', {ascending: false});
            const o = document.getElementById('f-o').value;
            const d = document.getElementById('f-d').value;
            if(o) q = q.eq('origin', o);
            if(d) q = q.eq('destination', d);
            const {data} = await q;
            list.innerHTML = data && data.length ? data.map(t => card(t, 'public')).join('') : '<p class="text-center py-20 text-gray-400">لا توجد رحلات حالياً</p>';
        }

        async function apiPost(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-pub'); btn.disabled = true; btn.innerText = "جاري الحفظ...";
            const role = document.getElementById('in-role').value;
            const row = {
                user_role: role, origin: document.getElementById('in-o').value, destination: document.getElementById('in-d').value,
                departure_time: t12(document.getElementById('in-t1').value), return_time: t12(document.getElementById('in-t2').value),
                whatsapp_number: "2" + document.getElementById('in-phone').value, notes: document.getElementById('in-notes').value,
                seats_available: role === 'captain' ? parseInt(document.getElementById('in-seats').value) : 0,
                has_ac: role === 'captain' ? (document.getElementById('in-ac').value === "true") : false,
                price_per_seat: role === 'captain' ? (document.getElementById('in-price').value + " ج.م") : "طلب راكب", status: 'active'
            };
            const {error} = await sb.from('trips').insert([row]);
            if(error) alert('خطأ: ' + error.message);
            else { alert('تم النشر بنجاح! 🎉'); document.getElementById('postForm').reset(); uiTab('search'); }
            btn.disabled = false; btn.innerText = "نشر الآن 🚀";
        }

        async function apiGetMyTrips() {
            const p = document.getElementById('my-phone').value;
            if(!p) return alert('أدخل رقمك');
            const {data} = await sb.from('trips').select('*').eq('whatsapp_number', '2'+p).order('origin', {ascending: true});
            document.getElementById('list-mine').innerHTML = data && data.length ? data.map(t => card(t, 'my')).join('') : '<p class="text-center p-5">لا توجد رحلات لهذا الرقم</p>';
        }

        function apiAdminLogin() {
            if(document.getElementById('admin-pass').value === 'Malika2017') {
                document.getElementById('admin-auth').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                apiAdminReload();
            } else alert('كلمة المرور خاطئة');
        }

        async function apiAdminReload() {
            let q = sb.from('trips').select('*').order('origin', {ascending: true});
            const searchPhone = document.getElementById('admin-search-phone').value;
            if(searchPhone) q = q.ilike('whatsapp_number', '%'+searchPhone+'%');
            const {data} = await q;
            document.getElementById('list-admin').innerHTML = data.map(t => card(t, 'admin')).join('');
        }

        async function apiAction(id, act, mode) {
            if(!confirm('تأكيد الإجراء؟')) return;
            if(act === 'del') await sb.from('trips').delete().eq('id', id);
            else if(act === 'done') await sb.from('trips').update({status: 'completed'}).eq('id', id);
            else if(act === 'active') await sb.from('trips').update({status: 'active'}).eq('id', id);
            
            if(mode === 'admin') apiAdminReload(); else apiGetMyTrips();
            apiGetTrips();
        }

        function openEdit(t, mode) {
            document.getElementById('global-edit-form').classList.remove('hidden');
            document.getElementById('edit-id').value = t.id;
            document.getElementById('edit-mode').value = mode;
            document.getElementById('edit-o').value = t.origin;
            document.getElementById('edit-d').value = t.destination;
            document.getElementById('edit-t1').value = t.departure_time;
            document.getElementById('edit-t2').value = t.return_time || '';
            document.getElementById('edit-price').value = t.price_per_seat;
            document.getElementById('edit-ac').value = t.has_ac.toString();
            document.getElementById('edit-notes').value = t.notes || '';
            window.scrollTo(0,0);
        }

        async function saveEdit() {
            const id = document.getElementById('edit-id').value;
            const mode = document.getElementById('edit-mode').value;
            const payload = {
                origin: document.getElementById('edit-o').value,
                destination: document.getElementById('edit-d').value,
                departure_time: document.getElementById('edit-t1').value,
                return_time: document.getElementById('edit-t2').value,
                price_per_seat: document.getElementById('edit-price').value,
                has_ac: document.getElementById('edit-ac').value === "true",
                notes: document.getElementById('edit-notes').value
            };
            await sb.from('trips').update(payload).eq('id', id);
            alert('تم حفظ التعديلات بنجاح');
            document.getElementById('global-edit-form').classList.add('hidden');
            if(mode === 'admin') apiAdminReload(); else apiGetMyTrips();
            apiGetTrips();
        }

        function card(t, mode) {
            const isCap = t.user_role === 'captain';
            const isDone = t.status === 'completed';
            let buttons = '';

            if(mode === 'public') {
                buttons = `<a href="https://wa.me/${t.whatsapp_number}" target="_blank" class="block text-center bg-[#25D366] text-white py-3 rounded-2xl font-bold text-sm mt-3 shadow-md">تواصل واتساب 💬</a>`;
            } else {
                buttons = `<div class="grid grid-cols-3 gap-2 mt-4">
                    ${isDone ? `<button onclick="apiAction('${t.id}', 'active', '${mode}')" class="bg-green-600 text-white p-2 rounded-xl text-[9px] font-bold shadow-sm">🔄 تنشيط</button>` : `<button onclick="apiAction('${t.id}', 'done', '${mode}')" class="bg-black text-white p-2 rounded-xl text-[9px] font-bold shadow-sm">✅ اكتمال</button>`}
                    <button onclick='openEdit(${JSON.stringify(t)}, "${mode}")' class="bg-blue-600 text-white p-2 rounded-xl text-[9px] font-bold shadow-sm">📝 تعديل</button>
                    <button onclick="apiAction('${t.id}', 'del', '${mode}')" class="bg-red-50 text-red-600 p-2 rounded-xl text-[9px] font-bold shadow-sm">❌ حذف</button>
                </div>`;
            }

            return `
                <div class="trip-card border-l-4 ${isCap ? 'border-l-blue-500' : 'border-l-orange-500'}">
                    <span class="role-badge ${isCap ? 'bg-blue-500' : 'bg-orange-500'}">${isCap?'كابتن':'راكب'}</span>
                    <div class="${isDone && mode !== 'admin' ? 'content-fade' : ''}">
                        <div class="flex justify-between items-start pt-4 mb-1">
                            <h3 class="font-bold text-sm text-slate-800">${t.origin} ⬅️ ${t.destination}</h3>
                            <span class="text-[#00a884] font-bold text-xs">${t.price_per_seat}</span>
                        </div>
                        <div class="text-[10px] text-gray-500 font-bold mb-2 italic">🕘 الذهاب: ${t.departure_time} ${t.return_time ? ' | عودة: '+t.return_time : ''}</div>
                        
                        ${isCap ? `
                        <div class="flex gap-2 mb-2">
                            <span class="feature-badge">💺 ${t.seats_available} مقاعد</span>
                            <span class="feature-badge">${t.has_ac ? '❄️ مكيفة' : '❌ بلا تكييف'}</span>
                        </div>` : ''}

                        ${t.notes ? `<p class="text-[10px] bg-gray-50 p-2 rounded-lg italic text-gray-600 mb-2 border-r-2 border-gray-300">"${t.notes}"</p>` : ''}
                        ${isDone ? '<p class="text-[9px] text-red-500 font-bold mb-1">● هذه الرحلة مكتملة ومخفية عن الجمهور</p>' : ''}
                    </div>
                    ${buttons}
                </div>`;
        }

        window.onload = () => {
            const dropdowns = ['in-o', 'in-d', 'f-o', 'f-d', 'edit-o', 'edit-d'];
            dropdowns.forEach(id => {
                const el = document.getElementById(id);
                el.innerHTML = `<option value="">${id.includes('f-') ? 'كل المناطق' : 'اختر منطقة'}</option>`;
                LOCS.forEach(l => { el.innerHTML += `<option value="${l}">${l}</option>`; });
            });
            apiGetTrips();
        };
    </script>
</body>
</html>
