<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharride - لوحة الراكب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }</style>
</head>
<body>

    <!-- شاشة التحقق المبدئية -->
    <div id="auth-guard" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <h1 class="text-3xl font-black text-[#00a884] mb-2 animate-pulse">Sharride</h1>
            <p class="text-slate-500 font-bold text-sm">جاري التحقق من الصلاحيات... 🙋‍♂️</p>
        </div>
    </div>

    <!-- المحتوى الرئيسي للمسار -->
    <div id="app-content" class="hidden min-h-screen pb-12">
        <header class="bg-white border-b border-slate-100 p-4 sticky top-0 z-40 shadow-sm">
            <div class="max-w-md mx-auto flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="bg-orange-100 text-orange-700 text-xs font-black px-3 py-1 rounded-full">🙋‍♂️ لوحة الراكب</span>
                </div>
                <button onclick="handleLogout()" class="bg-red-50 text-red-600 hover:bg-red-100 text-xs font-black px-4 py-2 rounded-xl transition">
                    تسجيل الخروج 🚪
                </button>
            </div>
        </header>

        <main class="max-w-md mx-auto p-4 space-y-4">
            <div class="bg-gradient-to-br from-orange-500 to-amber-600 rounded-[2rem] p-6 text-white shadow-xl">
                <h1 id="welcome-user" class="text-xl font-black mb-1">أهلاً بك 👋</h1>
                <p class="text-xs opacity-90 font-bold">ابحث عن رحلتك القادمة أو اضف مشوارك ليجده الكباتن.</p>
            </div>

            <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm text-center space-y-3">
                <h2 class="font-black text-slate-800 text-base">استكشاف الرحلات المتاحة</h2>
                <p class="text-xs text-slate-500 font-bold">هنا يمكنك البحث عن رحلات الكباتن المتوافقة مع خط سيرك.</p>
                <button class="w-full bg-orange-500 text-white font-black py-3.5 rounded-2xl shadow-md hover:bg-orange-600 transition text-sm">
                    🔍 ابحث عن رحلة الآن
                </button>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = "https://your-supabase-project.supabase.co";
        const SUPABASE_ANON_KEY = "your-anon-key";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = async () => {
            await verifyPassengerAccess();
        };

        async function verifyPassengerAccess() {
            try {
                const { data: { user }, error } = await sb.auth.getUser();

                if (error || !user) {
                    redirectToLogin();
                    return;
                }

                const role = user.user_metadata?.role;

                // حماية المسار: التأكد من أن المستخدم راكب حصراً
                if (role !== 'passenger') {
                    console.warn('تنبيه: محاولة وصول غير مصرح بها لمسار الراكب');
                    redirectToLogin();
                    return;
                }

                // عرض الاسم أو الإيميل
                const displayName = user.user_metadata?.full_name || user.email.split('@')[0];
                document.getElementById('welcome-user').textContent = `أهلاً بك يا ${displayName} 👋`;

                // تم التحقق بنجاح -> إظهار المحتوى
                document.getElementById('auth-guard').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');

            } catch (err) {
                console.error("خطأ حماية المسار:", err);
                redirectToLogin();
            }
        }

        async function handleLogout() {
            try {
                await sb.auth.signOut();
                redirectToLogin();
            } catch (err) {
                alert("حدث خطأ أثناء تسجيل الخروج: " + err.message);
            }
        }

        function redirectToLogin() {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
