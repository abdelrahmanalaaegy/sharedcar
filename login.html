<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharride - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-[2.5rem] p-8 border border-slate-100 shadow-xl text-center">
        <h1 class="text-3xl font-black text-[#00a884] mb-2">Sharride</h1>
        <p class="text-slate-500 text-xs font-bold mb-8">شارك رحلتك بسهولة وأمان</p>

        <div class="space-y-3">
            <button onclick="window.loginWithOAuth('google')" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 text-slate-700 font-bold py-3.5 px-4 rounded-2xl hover:bg-slate-50 transition shadow-sm">
                <span>متابعة باستخدام Google</span>
            </button>
            <button onclick="window.loginWithOAuth('facebook')" class="w-full flex items-center justify-center gap-3 bg-[#1877F2] text-white font-bold py-3.5 px-4 rounded-2xl hover:bg-[#166fe5] transition shadow-md">
                <span>متابعة باستخدام Facebook</span>
            </button>
        </div>
    </div>

    <script type="module">
        import { loginWithOAuth, setRole } from './js/auth.js';
        window.loginWithOAuth = loginWithOAuth;
        window.setRole = setRole;
    </script>
</body>
</html>
